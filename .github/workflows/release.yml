name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag must clear the same gate as everything else.
      - name: Verify
        run: npm run verify

      # Enforces the rule git-tag-strategy.md states in prose: the tag, the
      # manifest version, and the shipped artifact must agree. Discipline
      # forgets; this does not.
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$FILE_VERSION"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $FILE_VERSION."
            echo "Bump package.json and re-tag, or delete the tag:"
            echo "  git push origin --delete $GITHUB_REF_NAME && git tag -d $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: clickhero-clone ${{ github.ref_name }}
