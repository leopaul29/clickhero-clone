name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Lets the gate be run on demand from the Actions tab — the only way to
  # exercise the GitHub-hosted layer, which cannot be reproduced locally.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs exactly what `npm run verify` runs locally and in the pre-push hook.
  # One gate, three places, so "green on my machine" and "green in CI" cannot
  # drift apart. If you add a check here, add it to `verify` instead.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails instead of silently rewriting the lockfile, so a PR can never
      # install a dependency tree nobody reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
